name: Worker backend checks and deploy
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/worker.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'cloudflare-worker/**'
      - 'scripts/check_worker_deploy_access.py'
      - 'scripts/verify_worker_live.py'
  push:
    branches: [main, feature/floating-voice-writer]
    paths:
      - '.github/workflows/worker.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'cloudflare-worker/**'
      - 'scripts/check_worker_deploy_access.py'
      - 'scripts/verify_worker_live.py'
permissions:
  contents: read
concurrency:
  group: worker-backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Worker syntax
        run: npm run build
      - name: Test voice and existing Auto Reply backend
        run: npm run test:worker
      - name: Validate deploy bundle without changing Cloudflare
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir /tmp/worker-dry-run
      - name: Check existing deploy credentials without revealing them
        id: access
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/check_worker_deploy_access.py
      - name: Validate and install dedicated voice key
        if: github.event_name != 'pull_request' && steps.access.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VOICE_GEMINI_API_KEY: ${{ secrets.VOICE_GEMINI_API_KEY }}
        run: python3 scripts/configure_voice_key.py
      - name: Inspect deployed model names without exposing credentials
        if: github.event_name != 'pull_request' && steps.access.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/inspect_worker_models.py
      - name: Diagnose daily voice limit without exposing user identifiers
        if: github.event_name != 'pull_request' && steps.access.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 403f3c447ee5ba906794a7d1ee3852eb
        run: >-
          npx wrangler d1 execute ai-smart-reply-db --remote --json
          --command "SELECT COUNT(*) AS voice_users_today, COALESCE(MAX(count),0) AS highest_voice_requests_today, COALESCE(SUM(CASE WHEN count >= 40 THEN 1 ELSE 0 END),0) AS users_at_daily_limit FROM usage WHERE bucket LIKE date('now') || ':voice:%';"
      - name: Deploy existing Worker using existing GitHub credentials
        if: github.event_name != 'pull_request' && steps.access.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 403f3c447ee5ba906794a7d1ee3852eb
        run: npm run deploy
      - name: Verify live voice and reply routes
        if: github.event_name != 'pull_request' && steps.access.outputs.configured == 'true'
        run: python3 scripts/verify_worker_live.py
